[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-otc-edge-weight-prediction"
version = "0.1.0"
description = "Bitcoin OTC işaretli güven ağında P0 kenar ağırlığı tahmini"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.3.1",
  "pandas==2.3.0",
  "scipy==1.16.0",
  "networkx==3.5",
  "scikit-learn==1.7.0",
  "matplotlib==3.10.3",
  "seaborn==0.13.2",
  "pyarrow==21.0.0",
  "joblib==1.5.1",
  "psutil==7.0.0",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "nbconvert==7.16.6",
  "ipykernel==6.29.5",
  "jupyterlab==4.6.2",
  "reportlab==5.0.0",
  "pypdf==6.14.2",
  "pymupdf==1.28.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
